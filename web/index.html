<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DeepSeek Go" />
  <meta name="theme-color" content="#0b1120" />
  <title>DeepSeek Mobile Bridge</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Auth Gate -->
    <section id="auth-view" class="auth-view hidden">
      <div class="auth-card">
        <img src="/icon.svg" alt="DS" class="auth-logo" />
        <h1>DeepSeek Mobile Bridge</h1>
        <p class="muted">输入电脑端 Auth Token 连接本地工作区与 DeepSeek Agent。</p>
        <input id="auth-token-input" type="password" placeholder="粘贴 Auth Token" autocomplete="off" />
        <button id="auth-submit-btn" class="btn primary full">连接工作区</button>
        <p id="auth-error" class="error-text hidden"></p>
      </div>
    </section>

    <!-- Main App -->
    <div id="main-view" class="main-view hidden">
      <header class="top-bar">
        <div class="top-row">
          <button id="session-drawer-btn" class="icon-btn" aria-label="会话列表">☰</button>
          <div class="header-title-wrap">
            <div id="header-session-title" class="header-title">DeepSeek Mobile</div>
            <div class="header-sub">
              <span id="conn-badge" class="status-dot offline"></span>
              <span id="conn-label">未连接</span>
              <span class="sep">·</span>
              <select id="workspace-select" class="inline-select" aria-label="切换工作区"></select>
            </div>
          </div>
          <button id="new-session-btn" class="icon-btn" aria-label="新建会话">＋</button>
        </div>
      </header>

      <!-- Session Drawer -->
      <aside id="session-drawer" class="drawer hidden">
        <div class="drawer-backdrop" id="drawer-backdrop"></div>
        <div class="drawer-panel">
          <div class="drawer-header">
            <strong>DeepSeek 会话</strong>
            <button id="close-drawer-btn" class="icon-btn">✕</button>
          </div>
          <div id="session-list" class="session-list"></div>
        </div>
      </aside>

      <!-- Content Area -->
      <main class="tab-container">
        <!-- TAB 1: CHAT -->
        <section id="tab-chat" class="tab-panel active">
          <div id="chat-messages" class="chat-messages"></div>
          <div id="pending-box" class="pending-box hidden"></div>
          <div class="composer">
            <div class="composer-tools">
              <select id="quick-model-select" class="inline-select" aria-label="切换模型">
                <option value="deepseek-chat">deepseek-chat</option>
                <option value="deepseek-reasoner">deepseek-reasoner</option>
              </select>
              <button id="mention-open-file-btn" class="chip-btn hidden">@ 引用文件</button>
              <span id="agent-state-pill" class="state-pill">空闲</span>
            </div>
            <div class="composer-row">
              <textarea id="chat-input" rows="1" placeholder="向 DeepSeek 下达工作区指令..." enterkeyhint="send"></textarea>
              <button id="send-btn" class="btn primary">发送</button>
              <button id="cancel-btn" class="btn danger hidden">停止</button>
            </div>
          </div>
        </section>

        <!-- TAB 2: FILES -->
        <section id="tab-files" class="tab-panel">
          <div id="files-browser-pane" class="files-pane">
            <div class="files-toolbar">
              <input id="file-search-input" type="search" placeholder="搜索文件名或代码内容..." />
              <button id="new-file-btn" class="btn small">+ 文件</button>
              <button id="new-dir-btn" class="btn small">+ 目录</button>
            </div>
            <div id="files-breadcrumb" class="breadcrumb"></div>
            <div id="files-list" class="files-list"></div>
          </div>

          <div id="file-editor-pane" class="editor-pane hidden">
            <div class="editor-header">
              <button id="editor-back-btn" class="btn small">← 返回</button>
              <div class="editor-filepath" id="editor-filepath"></div>
              <button id="editor-ref-btn" class="btn small">@引用</button>
              <button id="editor-save-btn" class="btn primary small" disabled>保存</button>
            </div>
            <div class="symbol-bar" id="symbol-bar">
              <button data-ins="  ">Tab</button>
              <button data-ins="{">{</button>
              <button data-ins="}">}</button>
              <button data-ins="(">(</button>
              <button data-ins=")">)</button>
              <button data-ins="[">[</button>
              <button data-ins="]">]</button>
              <button data-ins="=">=</button>
              <button data-ins=":">:</button>
              <button data-ins="&quot;">"</button>
              <button data-ins="'">'</button>
              <button data-ins="/">/</button>
              <button data-ins="#">#</button>
            </div>
            <div id="editor-host" class="editor-host"></div>
          </div>
        </section>

        <!-- TAB 3: DIFF & SETTINGS -->
        <section id="tab-git" class="tab-panel">
          <div class="scroll-pane">
            <div class="card">
              <div class="card-head">
                <div>
                  <strong>Git 变更审查</strong>
                  <div id="git-branch-label" class="muted small-text">未检测</div>
                </div>
                <div class="row-gap">
                  <button id="git-refresh-btn" class="btn small">刷新</button>
                  <button id="git-ask-review-btn" class="btn primary small">让 DeepSeek 审查</button>
                </div>
              </div>
              <div id="git-files-list" class="git-files-list"></div>
              <pre id="git-diff-view" class="diff-view"></pre>
            </div>

            <div class="card">
              <div class="card-head">
                <strong>DeepSeek 与工作区设置</strong>
                <button id="logout-btn" class="btn small danger-outline">断开重登</button>
              </div>
              <label class="field">
                <span>DeepSeek API Key（留空则沿用已保存或环境变量 DEEPSEEK_API_KEY）</span>
                <input id="set-api-key" type="password" placeholder="sk-..." />
              </label>
              <label class="field">
                <span>API Base URL（默认 https://api.deepseek.com）</span>
                <input id="set-base-url" type="url" placeholder="https://api.deepseek.com" />
              </label>
              <label class="field">
                <span>默认模型（如 deepseek-chat 或 deepseek-reasoner）</span>
                <input id="set-model" type="text" placeholder="deepseek-chat" />
              </label>
              <label class="field">
                <span>工具审批策略</span>
                <select id="set-approval-mode">
                  <option value="ask_commands">仅命令执行前审批 (推荐)</option>
                  <option value="ask_writes">所有文件写入与命令均审批</option>
                  <option value="auto">全自动执行 (无需审批)</option>
                </select>
              </label>
              <label class="field">
                <span>允许的工作区目录（每行一个绝对路径）</span>
                <textarea id="set-workspaces" rows="3"></textarea>
              </label>
              <label class="field">
                <span>iOS Bark 推送地址（可选，如 https://api.day.app/你的Key）</span>
                <input id="set-bark-url" type="url" placeholder="https://api.day.app/..." />
              </label>
              <div class="row-between">
                <span id="settings-status" class="muted small-text"></span>
                <button id="save-settings-btn" class="btn primary">保存设置</button>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Bottom iOS Tab Bar -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-tab="chat">
          <span class="nav-ico">💬</span>
          <span>对话</span>
        </button>
        <button class="nav-btn" data-tab="files">
          <span class="nav-ico">📁</span>
          <span>文件</span>
        </button>
        <button class="nav-btn" data-tab="git">
          <span class="nav-ico">⎇</span>
          <span>Diff/设置</span>
        </button>
      </nav>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
