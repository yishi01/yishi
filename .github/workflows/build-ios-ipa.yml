name: Build iOS Native IPA (DeepSeek Mobile + Dynamic Island)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        working-directory: ios-native
        run: xcodegen generate

      - name: Build Unsigned iOS App & Dynamic Island Extension
        working-directory: ios-native
        run: |
          xcodebuild clean build \
            -project DeepSeekMobile.xcodeproj \
            -scheme DeepSeekMobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa for Sideloadly / AltStore
        working-directory: ios-native
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DeepSeekMobile.app Payload/
          zip -r -q DeepSeekMobile-unsigned.ipa Payload

      - name: Upload DeepSeekMobile-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekMobile-iOS-IPA
          path: ios-native/DeepSeekMobile-unsigned.ipa
          retention-days: 30
