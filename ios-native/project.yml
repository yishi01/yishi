name: DeepSeekMobile
options:
  bundleIdPrefix: com.agy.deepseek
  deploymentTarget:
    iOS: "16.2"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  DeepSeekMobile:
    type: application
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: DeepSeekMobile
    info:
      path: DeepSeekMobile/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Go
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "16"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "用于通过同一 Wi-Fi 局域网直连电脑端 DeepSeek 工作区与全盘文件服务"
        NSPhotoLibraryUsageDescription: "用于从手机相册选择图片发送给 DeepSeek 多模态模型分析"
        NSPhotoLibraryAddUsageDescription: "用于保存对话中的图片与电脑屏幕截图到手机相册"
        NSCameraUsageDescription: "用于拍照并直接发送给 DeepSeek 进行多模态视觉识别"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.agy.deepseek.mobile.deeplink
            CFBundleURLSchemes:
              - deepseekgo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agy.deepseek.mobile
        INFOPLIST_FILE: DeepSeekMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DeepSeekIslandExtension
        embed: true

  DeepSeekIslandExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: DeepSeekIslandExtension
      - path: DeepSeekMobile/Shared
    info:
      path: DeepSeekIslandExtension/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek Island
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "16"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agy.deepseek.mobile.island
        INFOPLIST_FILE: DeepSeekIslandExtension/Info.plist
